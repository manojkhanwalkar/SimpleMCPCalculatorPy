[project]
name = "simple-mcp-calculator"
version = "0.1.0"
description = "Python port of SimpleMCPCalculator: MCP calculator servers and clients over stdio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Manoj Khanwalkar" }]
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3,<3",
]

[project.scripts]
calculator-mcp-server = "simple_mcp_calculator.calculator_server.__main__:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "RUF", "PL", "PT", "ASYNC", "C4", "RET"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=simple_mcp_calculator --cov-branch --cov-report=term-missing --cov-report=xml"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A server that never replies must fail the test, not hang the run.
timeout = 120

[tool.coverage.run]
# Measure the server processes the end-to-end tests start, too.
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.5",
]
